services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bruno
      POSTGRES_PASSWORD: bruno
      POSTGRES_USER: bruno
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bruno -d bruno"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${BRUNO_POSTGRES_HOST_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.local-app
    command: sh -lc "rm -rf .next/* && bun install --frozen-lockfile && bun run db:migrate && bun run local:cloud:prepare && bun run build && sed -i 's#./.next/types/routes.d.ts#./.next/dev/types/routes.d.ts#' next-env.d.ts && bun run start --hostname 0.0.0.0"
    depends_on:
      local-cloud-runner-image:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      BRUNO_AGENT_SECRET_ACTIVE_KEY_VERSION: ${BRUNO_AGENT_SECRET_ACTIVE_KEY_VERSION:-}
      BRUNO_AGENT_SECRET_KEYS_JSON: ${BRUNO_AGENT_SECRET_KEYS_JSON:-}
      BRUNO_AUTH_MODE: development
      DATABASE_URL: postgres://bruno:bruno@postgres:5432/bruno
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://host.docker.internal:3000}
      BRUNO_DIGITALOCEAN_PROVIDER_MODE: local_docker
      BRUNO_DIGITALOCEAN_TOKEN: local-docker
      BRUNO_DIGITALOCEAN_SIZE_SLUG: ${BRUNO_DIGITALOCEAN_SIZE_SLUG:-s-1vcpu-2gb}
      BRUNO_HERMES_WORKLOAD_IMAGE: ${BRUNO_HERMES_WORKLOAD_IMAGE:-bruno-hermes:local}
      BRUNO_DIGITALOCEAN_SSH_KEY_IDS: none
      BRUNO_LOCAL_CLOUD_RUNNER_ENDPOINT_URL: http://host.docker.internal:3045
      BRUNO_RUNNER_BEARER_TOKEN: local-runner-command-token
      BRUNO_RUNNER_IMAGE: bruno-runner:local
    ports:
      - "${BRUNO_APP_HOST_PORT:-3000}:3000"
    profiles:
      - local-cloud
    volumes:
      - .:/app
      - dashboard-next-cache:/app/.next
      - dashboard-node-modules:/app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock

  local-cloud-runner-image:
    image: bruno-runner:local
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.runner
    command: sh -lc "true"
    profiles:
      - local-cloud

volumes:
  dashboard-next-cache:
  dashboard-node-modules:
  postgres-data:
