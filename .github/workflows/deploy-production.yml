name: Deploy production application

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy a new application release or roll back to a previously verified runner
        required: true
        default: release
        type: choice
        options:
          - release
          - verified-release
          - rollback
      rollback_image:
        description: Previously verified immutable image reference (rollback only)
        required: false
        type: string
      rollback_run_id:
        description: Successful production deployment run containing the verification artifact
        required: false
        type: string

concurrency:
  group: production-application-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ametel01/bruno-runner
  VERCEL_CLI_VERSION: 58.0.0

jobs:
  publish:
    if: inputs.action == 'release'
    name: Build, publish, scan, and verify digest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      immutable-image: ${{ steps.reference.outputs.image }}

    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Git-SHA runner image once
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}

      - name: Resolve immutable runner reference
        id: reference
        env:
          PUBLISHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${PUBLISHED_DIGEST}"
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}@${PUBLISHED_DIGEST}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Verify published runner digest
        env:
          IMMUTABLE_IMAGE: ${{ steps.reference.outputs.image }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMMUTABLE_IMAGE}"
          echo "Published an immutable Git-SHA runner candidate." >> "${GITHUB_STEP_SUMMARY}"

      - name: Scan critical fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.reference.outputs.image }}
          scanners: vuln
          format: sarif
          output: trivy-runner-image.sarif
          severity: CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-runner-image-${{ github.sha }}
          path: trivy-runner-image.sarif
          if-no-files-found: error
          retention-days: 90

  stage-control-plane:
    if: inputs.action == 'release'
    name: Stage compatible control plane without production traffic
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    outputs:
      deployment-url: ${{ steps.stage.outputs.deployment-url }}
    env:
      IMMUTABLE_IMAGE: ${{ needs.publish.outputs.immutable-image }}

    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Pull production project settings
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          bunx vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production
          --token="${VERCEL_TOKEN}"

      - name: Stage exact control plane without assigning production domains
        id: stage
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          CANDIDATE_DEPLOYMENT_URL="$(bunx vercel@${VERCEL_CLI_VERSION} deploy --prod --skip-domain --yes \
            --token="${VERCEL_TOKEN}" \
            --env "BRUNO_AUTH_MODE=operator" \
            --env "BRUNO_RUNNER_IMAGE=${IMMUTABLE_IMAGE}" \
            --env "BRUNO_RUNNER_ROLLOUT_BATCH_SIZE=1" \
            --build-env "BRUNO_AUTH_MODE=operator" \
            --build-env "BRUNO_CANARY_VERIFIED_DEPLOY=true" \
            --build-env "BRUNO_RUNNER_IMAGE=${IMMUTABLE_IMAGE}" \
            --build-env "BRUNO_RUNNER_ROLLOUT_BATCH_SIZE=1")"
          [[ "${CANDIDATE_DEPLOYMENT_URL}" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]]
          echo "deployment-url=${CANDIDATE_DEPLOYMENT_URL}" >> "${GITHUB_OUTPUT}"
          echo "Staged the exact release control plane without assigning production domains." >> "${GITHUB_STEP_SUMMARY}"

  canary:
    if: >-
      always() &&
      (inputs.action == 'release' || inputs.action == 'verified-release') &&
      (inputs.action != 'release' || needs.publish.result == 'success')
    name: Build and publish credential-free Verified Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: runner-release-canary
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: bruno_runner_release
          POSTGRES_USER: bruno
          POSTGRES_PASSWORD: bruno
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U bruno -d bruno_runner_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bruno:bruno@127.0.0.1:54329/bruno_runner_release
      NEXT_PUBLIC_APP_URL: http://host.docker.internal:3000
      BRUNO_AUTH_MODE: development
      BRUNO_ALLOW_PUBLIC_DEVELOPMENT: "true"
      BRUNO_DIGITALOCEAN_PROVIDER_MODE: local_docker
      BRUNO_DIGITALOCEAN_SSH_KEY_IDS: disabled
      BRUNO_DIGITALOCEAN_SIZE_SLUG: s-1vcpu-2gb
      BRUNO_HERMES_PRIVATE_NETWORK: bruno-hermes
      BRUNO_LOCAL_CLOUD_RUNNER_ENDPOINT_URL: http://127.0.0.1:3045
      BRUNO_RUNNER_IMAGE: ${{ needs.publish.outputs.immutable-image }}
      BRUNO_RELEASE_APPROVED_SNAPSHOT_OCI_REFERENCE: ${{ vars.BRUNO_RELEASE_APPROVED_SNAPSHOT_OCI_REFERENCE }}
      BRUNO_RELEASE_APPROVED_SNAPSHOT_BUNDLE_DIGEST: ${{ vars.BRUNO_RELEASE_APPROVED_SNAPSHOT_BUNDLE_DIGEST }}
      BRUNO_SNAPSHOT_TRUST_SET: ${{ vars.BRUNO_SNAPSHOT_TRUST_SET }}
      BRUNO_RELEASE_SIGNING_KEY_ID: ${{ vars.BRUNO_RELEASE_SIGNING_KEY_ID }}
      BRUNO_RELEASE_TRUST_SET: ${{ vars.BRUNO_RELEASE_TRUST_SET }}
      BRUNO_RELEASE_PREVIOUS_OCI_REFERENCE: ${{ vars.BRUNO_RELEASE_PREVIOUS_OCI_REFERENCE }}
      BRUNO_RELEASE_PREVIOUS_BUNDLE_DIGEST: ${{ vars.BRUNO_RELEASE_PREVIOUS_BUNDLE_DIGEST }}

    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Migrate isolated release database
        run: bun run db:migrate

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Log in to GHCR for immutable evidence
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Retrieve the exact Approved Snapshot without provider access
        id: approved-snapshot
        run: |
          set -euo pipefail
          [[ "${BRUNO_RELEASE_APPROVED_SNAPSHOT_OCI_REFERENCE}" =~ ^ghcr\.io/.+@sha256:[a-f0-9]{64}$ ]]
          [[ "${BRUNO_RELEASE_APPROVED_SNAPSHOT_BUNDLE_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          SNAPSHOT_MANIFEST="$(oras manifest fetch "${BRUNO_RELEASE_APPROVED_SNAPSHOT_OCI_REFERENCE}")"
          test "$(jq -r '.artifactType // empty' <<< "${SNAPSHOT_MANIFEST}")" = "application/vnd.bruno.runner.snapshot.bundle.v2"
          mkdir -p approved-snapshot
          oras pull "${BRUNO_RELEASE_APPROVED_SNAPSHOT_OCI_REFERENCE}" --output approved-snapshot
          test "$(find approved-snapshot -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test "$(tr -d '\n' < approved-snapshot/runner-snapshot-bundle.sha256)" = "${BRUNO_RELEASE_APPROVED_SNAPSHOT_BUNDLE_DIGEST}"
          RELEASE_RUNNER_IMAGE="${{ needs.publish.outputs.immutable-image }}"
          if [[ "${{ inputs.action }}" = "verified-release" ]]; then
            RELEASE_RUNNER_IMAGE="$(jq -r '.manifest.runnerImage.reference // empty' approved-snapshot/runner-snapshot-bundle.json)"
          fi
          [[ "${RELEASE_RUNNER_IMAGE}" =~ ^ghcr\.io/ametel01/bruno-runner:[a-f0-9]{40}@sha256:[a-f0-9]{64}$ ]]
          bun run runner:release:snapshot:verify -- \
            --runner-image "${RELEASE_RUNNER_IMAGE}" \
            --snapshot-bundle approved-snapshot/runner-snapshot-bundle.json \
            --snapshot-bundle-digest "${BRUNO_RELEASE_APPROVED_SNAPSHOT_BUNDLE_DIGEST}" \
            --output approved-snapshot/verified-images.json
          DEFAULT_AGENT_IMAGE="$(jq -r '.defaultAgentImage // empty' approved-snapshot/verified-images.json)"
          HERMES_IMAGE="$(jq -r '.hermesImage // empty' approved-snapshot/verified-images.json)"
          test -n "${DEFAULT_AGENT_IMAGE}"
          test -n "${HERMES_IMAGE}"
          echo "runner-image=${RELEASE_RUNNER_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "BRUNO_RUNNER_IMAGE=${RELEASE_RUNNER_IMAGE}" >> "${GITHUB_ENV}"
          echo "BRUNO_DOCKER_RUNNER_IMAGE=${DEFAULT_AGENT_IMAGE}" >> "${GITHUB_ENV}"
          echo "BRUNO_HERMES_WORKLOAD_IMAGE=${HERMES_IMAGE}" >> "${GITHUB_ENV}"

      - name: Scan the retained Approved Snapshot runner
        if: inputs.action == 'verified-release'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.approved-snapshot.outputs.runner-image }}
          scanners: vuln
          format: sarif
          output: trivy-runner-image.sarif
          severity: CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload retained runner scan report
        if: always() && inputs.action == 'verified-release'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-approved-runner-image-${{ github.sha }}
          path: trivy-runner-image.sarif
          if-no-files-found: error
          retention-days: 90

      - name: Preload exact full-fixture images
        run: |
          set -euo pipefail
          for image in \
            "${BRUNO_RUNNER_IMAGE}" \
            "${BRUNO_DOCKER_RUNNER_IMAGE}" \
            "${BRUNO_HERMES_WORKLOAD_IMAGE}"
          do
            [[ "${image}" =~ @sha256:[a-f0-9]{64}$ ]]
          done
          docker pull "${BRUNO_RUNNER_IMAGE}"
          docker pull "${BRUNO_DOCKER_RUNNER_IMAGE}"
          docker pull "${BRUNO_HERMES_WORKLOAD_IMAGE}"
          docker image inspect \
            "${BRUNO_RUNNER_IMAGE}" \
            "${BRUNO_DOCKER_RUNNER_IMAGE}" \
            "${BRUNO_HERMES_WORKLOAD_IMAGE}" >/dev/null

      - name: Exercise the exact full fixture and verify cleanup
        env:
          BRUNO_RUNNER_BEARER_TOKEN: ${{ secrets.RUNNER_RELEASE_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          bun run build
          bun run start --hostname 0.0.0.0 > "${RUNNER_TEMP}/runner-release-control-plane.log" 2>&1 &
          CONTROL_PLANE_PID=$!
          cleanup_control_plane() {
            kill "${CONTROL_PLANE_PID}" >/dev/null 2>&1 || true
            wait "${CONTROL_PLANE_PID}" >/dev/null 2>&1 || true
            docker network rm "${BRUNO_HERMES_PRIVATE_NETWORK}" >/dev/null 2>&1 || true
          }
          trap cleanup_control_plane EXIT
          CONTROL_PLANE_READY=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health >/dev/null; then
              CONTROL_PLANE_READY=true
              break
            fi
            sleep 1
          done
          test "${CONTROL_PLANE_READY}" = "true"
          docker network inspect "${BRUNO_HERMES_PRIVATE_NETWORK}" >/dev/null 2>&1 || \
            docker network create "${BRUNO_HERMES_PRIVATE_NETWORK}" >/dev/null
          FIXTURE_HOST_GATEWAY="$(docker network inspect \
            --format '{{(index .IPAM.Config 0).Gateway}}' "${BRUNO_HERMES_PRIVATE_NETWORK}")"
          test -n "${FIXTURE_HOST_GATEWAY}"
          docker run --rm --network "${BRUNO_HERMES_PRIVATE_NETWORK}" --add-host "host.docker.internal:${FIXTURE_HOST_GATEWAY}" "${BRUNO_DOCKER_RUNNER_IMAGE}" \
            wget --quiet --output-document=/dev/null http://host.docker.internal:3000/health
          mkdir -p runner-release-evidence
          bun run runner:release:smoke -- --image "${BRUNO_RUNNER_IMAGE}" --provider local_docker \
            --output runner-release-evidence/runner-release-smoke.json
          jq -e '.ok == true and .code == "passed" and .cleanupVerified == true' \
            runner-release-evidence/runner-release-smoke.json >/dev/null
          VERIFIED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          echo "VERIFIED_AT=${VERIFIED_AT}" >> "${GITHUB_ENV}"

      - name: Retain sanitized control-plane ingress evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p runner-release-evidence
          if [[ -f "${RUNNER_TEMP}/runner-release-control-plane.log" ]]; then
            jq --raw-input --slurp '
              split("\n")
              | map(try fromjson catch empty)
              | map(select(.component == "runner.ingress"))
              | map({time, component, event, endpoint, reason, issueCount, issueFields, errorName, errorCode})
            ' "${RUNNER_TEMP}/runner-release-control-plane.log" \
              > runner-release-evidence/runner-release-control-plane-events.json
          else
            printf '[]\n' > runner-release-evidence/runner-release-control-plane-events.json
          fi

      - name: Upload full-fixture smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-release-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            runner-release-evidence/runner-release-smoke.json
            runner-release-evidence/runner-release-control-plane-events.json
          if-no-files-found: error
          retention-days: 90

      - name: Build signed Verified Release joined to the Approved Snapshot
        env:
          BRUNO_RELEASE_SIGNING_KEY_PEM: ${{ secrets.BRUNO_RELEASE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          bun run runner:release:bundle -- \
            --control-plane-source-revision "${GITHUB_SHA}" \
            --runner-image "${BRUNO_RUNNER_IMAGE}" \
            --snapshot-oci-reference "${BRUNO_RELEASE_APPROVED_SNAPSHOT_OCI_REFERENCE}" \
            --snapshot-bundle-digest "${BRUNO_RELEASE_APPROVED_SNAPSHOT_BUNDLE_DIGEST}" \
            --snapshot-bundle approved-snapshot/runner-snapshot-bundle.json \
            --smoke-result runner-release-evidence/runner-release-smoke.json \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --full-fixture-passed-at "${VERIFIED_AT}" \
            --cleanup-verified-at "${VERIFIED_AT}" \
            --bundle-out runner-release-evidence/runner-release-bundle.json \
            --digest-out runner-release-evidence/runner-release-bundle.sha256
          echo "${BRUNO_RUNNER_IMAGE}" > runner-release-evidence/immutable-image.txt

      - name: Publish and re-verify digest-addressed Verified Release
        run: |
          set -euo pipefail
          bun run runner:release:registry -- publish \
            --repository "ghcr.io/${{ github.repository_owner }}/bruno-runner-release-bundles" \
            --bundle runner-release-evidence/runner-release-bundle.json \
            --digest runner-release-evidence/runner-release-bundle.sha256 \
            --public-key-out runner-release-evidence/runner-release-signing-key.pem \
            --publication-out runner-release-evidence/runner-release-oci-publication.json
          echo "Published a signed Verified Release after the full local fixture and exact cleanup; no DigitalOcean resource was requested and the workflow does not claim to boot the provider snapshot." >> "${GITHUB_STEP_SUMMARY}"

      - name: Attest allowlisted Verified Release artifacts (attempt 1 of 3)
        id: attest_release_attempt_1
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            runner-release-evidence/runner-release-bundle.json
            runner-release-evidence/runner-release-bundle.sha256
            runner-release-evidence/runner-release-signing-key.pem
            runner-release-evidence/runner-release-oci-publication.json

      - name: Attest allowlisted Verified Release artifacts (attempt 2 of 3)
        id: attest_release_attempt_2
        if: steps.attest_release_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            runner-release-evidence/runner-release-bundle.json
            runner-release-evidence/runner-release-bundle.sha256
            runner-release-evidence/runner-release-signing-key.pem
            runner-release-evidence/runner-release-oci-publication.json

      - name: Attest allowlisted Verified Release artifacts (attempt 3 of 3)
        id: attest_release_attempt_3
        if: steps.attest_release_attempt_2.outcome == 'failure'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            runner-release-evidence/runner-release-bundle.json
            runner-release-evidence/runner-release-bundle.sha256
            runner-release-evidence/runner-release-signing-key.pem
            runner-release-evidence/runner-release-oci-publication.json

      - name: Upload Verified Release convenience artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-runner-release
          path: |
            runner-release-evidence/immutable-image.txt
            runner-release-evidence/runner-release-bundle.json
            runner-release-evidence/runner-release-bundle.sha256
            runner-release-evidence/runner-release-signing-key.pem
            runner-release-evidence/runner-release-oci-publication.json
            runner-release-evidence/runner-release-smoke.json
          if-no-files-found: error
          retention-days: 90

      - name: Record safe failure summary
        if: failure()
        run: echo "Verified Release failed; promotion is blocked and no DigitalOcean resource was requested." >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    if: inputs.action == 'release'
    name: Deploy Verified Release to production
    needs:
      - publish
      - stage-control-plane
      - canary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      IMMUTABLE_IMAGE: ${{ needs.publish.outputs.immutable-image }}
      CANDIDATE_DEPLOYMENT_URL: ${{ needs.stage-control-plane.outputs.deployment-url }}

    steps:
      - name: Check out exact verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Promote the exact Verified Release deployment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          bunx vercel@${VERCEL_CLI_VERSION} promote "${CANDIDATE_DEPLOYMENT_URL}"
          --yes --timeout=5m --token="${VERCEL_TOKEN}"

      - name: Verify production health and required release
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          VERIFIED=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "${PRODUCTION_URL}/health" > /dev/null; then
              REQUIRED="$(curl --fail --silent --show-error \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                "${PRODUCTION_URL}/api/internal/runner-release/required" || true)"
              if [[ "$(jq -r '.requiredRelease.imageReference // empty' <<< "${REQUIRED}")" = "${IMMUTABLE_IMAGE}" ]] \
                && [[ "$(jq -r '.rollout.batchSize // empty' <<< "${REQUIRED}")" = "1" ]]; then
                VERIFIED=true
                break
              fi
            fi
            sleep 5
          done
          test "${VERIFIED}" = "true"
          echo "Production requires the full-fixture Verified Release runner with batch size 1." >> "${GITHUB_STEP_SUMMARY}"

  rollback:
    if: inputs.action == 'rollback'
    name: Roll back to a verified immutable runner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      ROLLBACK_IMAGE: ${{ inputs.rollback_image }}

    steps:
      - name: Validate rollback inputs
        env:
          ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
        run: |
          set -euo pipefail
          [[ "${ROLLBACK_IMAGE}" =~ ^ghcr\.io/ametel01/bruno-runner:[a-f0-9]{40}@sha256:[a-f0-9]{64}$ ]]
          [[ "${ROLLBACK_RUN_ID}" =~ ^[1-9][0-9]{0,19}$ ]]

      - name: Download prior canary verification
        uses: actions/download-artifact@v4
        with:
          name: verified-runner-release
          path: verified-runner-release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.rollback_run_id }}

      - name: Require exact previously verified image
        run: test "$(cat verified-runner-release/immutable-image.txt)" = "${ROLLBACK_IMAGE}"

      - name: Check out rollback workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Pull production project settings
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          bunx vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production
          --token="${VERCEL_TOKEN}"

      - name: Deploy verified rollback digest with rollout halted
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          bunx vercel@${VERCEL_CLI_VERSION} deploy --prod --yes \
            --token="${VERCEL_TOKEN}" \
            --env "BRUNO_AUTH_MODE=operator" \
            --env "BRUNO_RUNNER_IMAGE=${ROLLBACK_IMAGE}" \
            --env "BRUNO_RUNNER_ROLLOUT_BATCH_SIZE=0" \
            --build-env "BRUNO_AUTH_MODE=operator" \
            --build-env "BRUNO_CANARY_VERIFIED_DEPLOY=true" \
            --build-env "BRUNO_RUNNER_IMAGE=${ROLLBACK_IMAGE}" \
            --build-env "BRUNO_RUNNER_ROLLOUT_BATCH_SIZE=0"

      - name: Verify rollback health, digest, and halted rollout
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          VERIFIED=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "${PRODUCTION_URL}/health" > /dev/null; then
              REQUIRED="$(curl --fail --silent --show-error \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                "${PRODUCTION_URL}/api/internal/runner-release/required" || true)"
              if [[ "$(jq -r '.requiredRelease.imageReference // empty' <<< "${REQUIRED}")" = "${ROLLBACK_IMAGE}" ]] \
                && [[ "$(jq -r '.rollout.halted // empty' <<< "${REQUIRED}")" = "true" ]]; then
                VERIFIED=true
                break
              fi
            fi
            sleep 5
          done
          test "${VERIFIED}" = "true"
          echo "Production rolled back to a previously verified digest with rollout halted." >> "${GITHUB_STEP_SUMMARY}"
