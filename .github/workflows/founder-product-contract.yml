name: Founder Product Contract

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Both modes require signed lifecycle evidence; release also requires attended AT digests
        required: true
        default: ci
        type: choice
        options:
          - ci
          - release
      voiceover_attended_summary_json:
        description: Strict sanitized exact-candidate VoiceOver/Safari attended summary JSON
        required: false
        type: string
      talkback_attended_summary_json:
        description: Strict sanitized exact-candidate TalkBack/Chrome attended summary JSON
        required: false
        type: string
      moderated_founder_summary_json:
        description: Allowlisted moderated-study counts and evidence digest; no identities or recordings
        required: false
        type: string
      provider_decision_summary_json:
        description: Exact-revision provider outcomes, clean-attempt metadata, and evidence digests
        required: false
        type: string
      production_provider_qualification_summary_json:
        description: Allowlisted attended Clerk and Lemon clean-attempt qualification summary; no source payloads
        required: false
        type: string
      general_release_operational_summary_json:
        description: Allowlisted exact-candidate clean-attempt operational, privacy, billing, recovery, and retirement evidence
        required: false
        type: string

permissions:
  actions: read
  checks: write
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: founder-product-contract-${{ github.sha }}
  cancel-in-progress: false

jobs:
  contract:
    name: Exact-release Founder contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.mode == 'release' && 'runner-release-canary' || 'ci' }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bruno
          POSTGRES_USER: bruno
          POSTGRES_PASSWORD: bruno
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U bruno -d bruno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://bruno:bruno@127.0.0.1:54329/bruno
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      BRUNO_AUTH_MODE: development
      PORT: "3100"
      PLAYWRIGHT_BASE_URL: http://localhost:3100
      BRUNO_FOUNDER_CONTRACT_SOURCE_REVISION: ${{ github.sha }}
      BRUNO_FOUNDER_PROTECTED_RUNTIME_REVISION: ${{ vars.BRUNO_FOUNDER_RELEASE_RUNTIME_REVISION }}
      BRUNO_FOUNDER_CONTRACT_RUN_ID: github-${{ github.run_id }}
      BRUNO_FOUNDER_CONTRACT_RUN_ATTEMPT: ${{ github.run_attempt }}
      BRUNO_FOUNDER_CONTRACT_MODE: ${{ inputs.mode || 'ci' }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_ATTENDED_SUMMARY_JSON: ${{ inputs.voiceover_attended_summary_json }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_ATTENDED_SUMMARY_JSON: ${{ inputs.talkback_attended_summary_json }}
      BRUNO_FOUNDER_MODERATED_SUMMARY_JSON: ${{ inputs.moderated_founder_summary_json }}
      BRUNO_FOUNDER_PROVIDER_DECISION_SUMMARY_JSON: ${{ inputs.provider_decision_summary_json }}
      BRUNO_FOUNDER_PRODUCTION_PROVIDER_QUALIFICATION_SUMMARY_JSON: ${{ inputs.production_provider_qualification_summary_json }}
      BRUNO_FOUNDER_GENERAL_RELEASE_OPERATIONAL_SUMMARY_JSON: ${{ inputs.general_release_operational_summary_json }}
      BRUNO_FOUNDER_EXPECTED_LIVE_STORE_DIGEST: ${{ vars.BRUNO_FOUNDER_EXPECTED_LIVE_STORE_DIGEST }}
      BRUNO_FOUNDER_EXPECTED_LIVE_PRODUCT_DIGEST: ${{ vars.BRUNO_FOUNDER_EXPECTED_LIVE_PRODUCT_DIGEST }}
      BRUNO_FOUNDER_CONTRACT_SCENARIO_LEDGER_PATH: founder-contract-artifacts/scenario-ledger.json

    steps:
      - name: Check out exact release candidate
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Require the exact release runtime revision
        if: inputs.mode == 'release'
        shell: bash
        run: |
          [[ "$BRUNO_FOUNDER_PROTECTED_RUNTIME_REVISION" =~ ^[A-Za-z0-9][A-Za-z0-9._:@/+-]{0,127}$ ]]
          [[ "$BRUNO_FOUNDER_EXPECTED_LIVE_STORE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$BRUNO_FOUNDER_EXPECTED_LIVE_PRODUCT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$BRUNO_FOUNDER_EXPECTED_LIVE_STORE_DIGEST" != "$BRUNO_FOUNDER_EXPECTED_LIVE_PRODUCT_DIGEST"
          echo "BRUNO_FOUNDER_CONTRACT_RUNTIME_REVISION=$BRUNO_FOUNDER_PROTECTED_RUNTIME_REVISION" >> "$GITHUB_ENV"

      - name: Bind the deterministic CI runtime revision
        if: inputs.mode != 'release'
        run: echo "BRUNO_FOUNDER_CONTRACT_RUNTIME_REVISION=founder-contract-v1" >> "$GITHUB_ENV"

      - name: Reject previously failed exact candidate
        env:
          BRUNO_FOUNDER_CONTRACT_GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/check-founder-product-contract-candidate-history.ts

      - name: Create the durable protected release candidate control
        id: release_candidate_control
        if: inputs.mode == 'release'
        env:
          BRUNO_FOUNDER_CONTRACT_GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/founder-product-contract-candidate-control.ts create

      - name: Install exact browser engines
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run migrations
        run: bun run db:migrate

      - name: Bind the observation time
        run: echo "BRUNO_FOUNDER_CONTRACT_OBSERVED_AT=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" >> "$GITHUB_ENV"

      - name: Run all-or-nothing Founder Product Contract (release)
        if: inputs.mode == 'release'
        env:
          BRUNO_FOUNDER_CONTRACT_SCENARIO_SIGNING_SECRET: ${{ secrets.BRUNO_FOUNDER_CONTRACT_SCENARIO_SIGNING_SECRET }}
        run: bun run founder:contract

      - name: Run all-or-nothing Founder Product Contract (ci)
        if: inputs.mode != 'release'
        shell: bash
        run: |
          ci_signing_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$ci_signing_secret"
          BRUNO_FOUNDER_CONTRACT_SCENARIO_SIGNING_SECRET="$ci_signing_secret" bun run founder:contract

      - name: Attest the allowlisted exact-release summary
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            founder-contract-artifacts/founder-product-contract.json
            founder-contract-artifacts/founder-initial-general-release-decision.json

      - name: Retain the allowlisted summary
        uses: actions/upload-artifact@v4
        with:
          name: founder-product-contract-${{ github.sha }}
          path: |
            founder-contract-artifacts/founder-product-contract.json
            founder-contract-artifacts/founder-initial-general-release-decision.json
          if-no-files-found: error
          retention-days: 90

      - name: Finalize and enforce the durable release candidate control
        if: always() && inputs.mode == 'release'
        env:
          BRUNO_FOUNDER_CANDIDATE_CHECK_RUN_ID: ${{ steps.release_candidate_control.outputs.check_run_id }}
          BRUNO_FOUNDER_CONTRACT_GITHUB_TOKEN: ${{ github.token }}
          BRUNO_FOUNDER_PRIOR_JOB_STATUS: ${{ job.status }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          BRUNO_FOUNDER_RELEASE_RUNTIME_REVISION: ${{ env.BRUNO_FOUNDER_CONTRACT_RUNTIME_REVISION }}
        run: bun scripts/founder-product-contract-candidate-control.ts finalize
