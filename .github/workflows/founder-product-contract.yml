name: Founder Product Contract

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Both modes require signed lifecycle evidence; release also requires attended AT digests
        required: true
        default: ci
        type: choice
        options:
          - ci
          - release
      voiceover_evidence_digest:
        description: Sanitized sha256 digest from attended VoiceOver on Safari evidence
        required: false
        type: string
      voiceover_os_version:
        description: OS version used for the attended VoiceOver journey
        required: false
        type: string
      voiceover_browser_version:
        description: Safari version used for the attended VoiceOver journey
        required: false
        type: string
      voiceover_observed_at:
        description: Exact ISO-8601 time of the attended VoiceOver journey
        required: false
        type: string
      voiceover_runtime_revision:
        description: Exact protected runtime exercised by the attended VoiceOver journey
        required: false
        type: string
      voiceover_attempts:
        description: Separately reviewed VoiceOver attempt count; release requires exactly 1
        required: false
        type: string
      voiceover_failures:
        description: Separately reviewed VoiceOver failure count; release requires 0
        required: false
        type: string
      voiceover_flakes:
        description: Separately reviewed VoiceOver flaky retry count; release requires 0
        required: false
        type: string
      voiceover_skips:
        description: Separately reviewed VoiceOver skip count; release requires 0
        required: false
        type: string
      voiceover_independent_human_reviewers:
        description: Independent attended human VoiceOver reviewers; release requires exactly 1
        required: false
        type: string
      voiceover_automated_runs:
        description: Automated VoiceOver sources; release requires 0
        required: false
        type: string
      voiceover_owner_participants:
        description: Owner VoiceOver participants; release requires 0
        required: false
        type: string
      voiceover_self_tests:
        description: Self-tested VoiceOver journeys; release requires 0
        required: false
        type: string
      voiceover_friend_or_family_participants:
        description: Friend or family VoiceOver participants; release requires 0
        required: false
        type: string
      voiceover_support_interventions:
        description: Support-assisted VoiceOver interventions; release requires 0
        required: false
        type: string
      voiceover_external_beta_participants:
        description: Ordinary External Beta VoiceOver participants; release requires 0
        required: false
        type: string
      voiceover_coached_participants:
        description: Coached VoiceOver participants; release requires 0
        required: false
        type: string
      voiceover_facilitator_rescues:
        description: VoiceOver facilitator rescues; release requires 0
        required: false
        type: string
      voiceover_trusted_preview_participants:
        description: Trusted Preview VoiceOver participants; release requires 0
        required: false
        type: string
      voiceover_build_team_participants:
        description: Build-team VoiceOver participants; release requires 0
        required: false
        type: string
      talkback_evidence_digest:
        description: Sanitized sha256 digest from attended TalkBack on Chrome evidence
        required: false
        type: string
      talkback_os_version:
        description: OS version used for the attended TalkBack journey
        required: false
        type: string
      talkback_browser_version:
        description: Chrome version used for the attended TalkBack journey
        required: false
        type: string
      talkback_observed_at:
        description: Exact ISO-8601 time of the attended TalkBack journey
        required: false
        type: string
      talkback_runtime_revision:
        description: Exact protected runtime exercised by the attended TalkBack journey
        required: false
        type: string
      talkback_attempts:
        description: Separately reviewed TalkBack attempt count; release requires exactly 1
        required: false
        type: string
      talkback_failures:
        description: Separately reviewed TalkBack failure count; release requires 0
        required: false
        type: string
      talkback_flakes:
        description: Separately reviewed TalkBack flaky retry count; release requires 0
        required: false
        type: string
      talkback_skips:
        description: Separately reviewed TalkBack skip count; release requires 0
        required: false
        type: string
      talkback_independent_human_reviewers:
        description: Independent attended human TalkBack reviewers; release requires exactly 1
        required: false
        type: string
      talkback_automated_runs:
        description: Automated TalkBack sources; release requires 0
        required: false
        type: string
      talkback_owner_participants:
        description: Owner TalkBack participants; release requires 0
        required: false
        type: string
      talkback_self_tests:
        description: Self-tested TalkBack journeys; release requires 0
        required: false
        type: string
      talkback_friend_or_family_participants:
        description: Friend or family TalkBack participants; release requires 0
        required: false
        type: string
      talkback_support_interventions:
        description: Support-assisted TalkBack interventions; release requires 0
        required: false
        type: string
      talkback_external_beta_participants:
        description: Ordinary External Beta TalkBack participants; release requires 0
        required: false
        type: string
      talkback_coached_participants:
        description: Coached TalkBack participants; release requires 0
        required: false
        type: string
      talkback_facilitator_rescues:
        description: TalkBack facilitator rescues; release requires 0
        required: false
        type: string
      talkback_trusted_preview_participants:
        description: Trusted Preview TalkBack participants; release requires 0
        required: false
        type: string
      talkback_build_team_participants:
        description: Build-team TalkBack participants; release requires 0
        required: false
        type: string
      moderated_founder_summary_json:
        description: Allowlisted moderated-study counts and evidence digest; no identities or recordings
        required: false
        type: string
      provider_decision_summary_json:
        description: Exact-revision provider outcomes, clean-attempt metadata, and evidence digests
        required: false
        type: string
      production_provider_qualification_summary_json:
        description: Allowlisted attended Clerk and Lemon clean-attempt qualification summary; no source payloads
        required: false
        type: string
      general_release_operational_summary_json:
        description: Allowlisted exact-candidate clean-attempt operational, privacy, billing, recovery, and retirement evidence
        required: false
        type: string

permissions:
  actions: read
  checks: write
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: founder-product-contract-${{ github.sha }}
  cancel-in-progress: false

jobs:
  contract:
    name: Exact-release Founder contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.mode == 'release' && 'runner-release-canary' || 'ci' }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bruno
          POSTGRES_USER: bruno
          POSTGRES_PASSWORD: bruno
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U bruno -d bruno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://bruno:bruno@127.0.0.1:54329/bruno
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      BRUNO_AUTH_MODE: development
      PORT: "3100"
      PLAYWRIGHT_BASE_URL: http://localhost:3100
      BRUNO_FOUNDER_CONTRACT_SOURCE_REVISION: ${{ github.sha }}
      BRUNO_FOUNDER_PROTECTED_RUNTIME_REVISION: ${{ vars.BRUNO_FOUNDER_RELEASE_RUNTIME_REVISION }}
      BRUNO_FOUNDER_CONTRACT_RUN_ID: github-${{ github.run_id }}
      BRUNO_FOUNDER_CONTRACT_RUN_ATTEMPT: ${{ github.run_attempt }}
      BRUNO_FOUNDER_CONTRACT_MODE: ${{ inputs.mode || 'ci' }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_DIGEST: ${{ inputs.voiceover_evidence_digest }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_OS_VERSION: ${{ inputs.voiceover_os_version }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_BROWSER_VERSION: ${{ inputs.voiceover_browser_version }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_OBSERVED_AT: ${{ inputs.voiceover_observed_at }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_RUNTIME_REVISION: ${{ inputs.voiceover_runtime_revision }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_ATTEMPTS: ${{ inputs.voiceover_attempts }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_FAILURES: ${{ inputs.voiceover_failures }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_FLAKES: ${{ inputs.voiceover_flakes }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_SKIPS: ${{ inputs.voiceover_skips }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_INDEPENDENT_HUMAN_REVIEWERS: ${{ inputs.voiceover_independent_human_reviewers }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_AUTOMATED_RUNS: ${{ inputs.voiceover_automated_runs }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_OWNER_PARTICIPANTS: ${{ inputs.voiceover_owner_participants }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_SELF_TESTS: ${{ inputs.voiceover_self_tests }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_FRIEND_OR_FAMILY_PARTICIPANTS: ${{ inputs.voiceover_friend_or_family_participants }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_SUPPORT_INTERVENTIONS: ${{ inputs.voiceover_support_interventions }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_EXTERNAL_BETA_PARTICIPANTS: ${{ inputs.voiceover_external_beta_participants }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_COACHED_PARTICIPANTS: ${{ inputs.voiceover_coached_participants }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_FACILITATOR_RESCUES: ${{ inputs.voiceover_facilitator_rescues }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_TRUSTED_PREVIEW_PARTICIPANTS: ${{ inputs.voiceover_trusted_preview_participants }}
      BRUNO_FOUNDER_CONTRACT_VOICEOVER_BUILD_TEAM_PARTICIPANTS: ${{ inputs.voiceover_build_team_participants }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_DIGEST: ${{ inputs.talkback_evidence_digest }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_OS_VERSION: ${{ inputs.talkback_os_version }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_BROWSER_VERSION: ${{ inputs.talkback_browser_version }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_OBSERVED_AT: ${{ inputs.talkback_observed_at }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_RUNTIME_REVISION: ${{ inputs.talkback_runtime_revision }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_ATTEMPTS: ${{ inputs.talkback_attempts }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_FAILURES: ${{ inputs.talkback_failures }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_FLAKES: ${{ inputs.talkback_flakes }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_SKIPS: ${{ inputs.talkback_skips }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_INDEPENDENT_HUMAN_REVIEWERS: ${{ inputs.talkback_independent_human_reviewers }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_AUTOMATED_RUNS: ${{ inputs.talkback_automated_runs }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_OWNER_PARTICIPANTS: ${{ inputs.talkback_owner_participants }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_SELF_TESTS: ${{ inputs.talkback_self_tests }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_FRIEND_OR_FAMILY_PARTICIPANTS: ${{ inputs.talkback_friend_or_family_participants }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_SUPPORT_INTERVENTIONS: ${{ inputs.talkback_support_interventions }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_EXTERNAL_BETA_PARTICIPANTS: ${{ inputs.talkback_external_beta_participants }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_COACHED_PARTICIPANTS: ${{ inputs.talkback_coached_participants }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_FACILITATOR_RESCUES: ${{ inputs.talkback_facilitator_rescues }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_TRUSTED_PREVIEW_PARTICIPANTS: ${{ inputs.talkback_trusted_preview_participants }}
      BRUNO_FOUNDER_CONTRACT_TALKBACK_BUILD_TEAM_PARTICIPANTS: ${{ inputs.talkback_build_team_participants }}
      BRUNO_FOUNDER_MODERATED_SUMMARY_JSON: ${{ inputs.moderated_founder_summary_json }}
      BRUNO_FOUNDER_PROVIDER_DECISION_SUMMARY_JSON: ${{ inputs.provider_decision_summary_json }}
      BRUNO_FOUNDER_PRODUCTION_PROVIDER_QUALIFICATION_SUMMARY_JSON: ${{ inputs.production_provider_qualification_summary_json }}
      BRUNO_FOUNDER_GENERAL_RELEASE_OPERATIONAL_SUMMARY_JSON: ${{ inputs.general_release_operational_summary_json }}
      BRUNO_FOUNDER_EXPECTED_LIVE_STORE_DIGEST: ${{ vars.BRUNO_FOUNDER_EXPECTED_LIVE_STORE_DIGEST }}
      BRUNO_FOUNDER_EXPECTED_LIVE_PRODUCT_DIGEST: ${{ vars.BRUNO_FOUNDER_EXPECTED_LIVE_PRODUCT_DIGEST }}
      BRUNO_FOUNDER_CONTRACT_SCENARIO_LEDGER_PATH: founder-contract-artifacts/scenario-ledger.json

    steps:
      - name: Check out exact release candidate
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Require the exact release runtime revision
        if: inputs.mode == 'release'
        shell: bash
        run: |
          [[ "$BRUNO_FOUNDER_PROTECTED_RUNTIME_REVISION" =~ ^[A-Za-z0-9][A-Za-z0-9._:@/+-]{0,127}$ ]]
          [[ "$BRUNO_FOUNDER_EXPECTED_LIVE_STORE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$BRUNO_FOUNDER_EXPECTED_LIVE_PRODUCT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$BRUNO_FOUNDER_EXPECTED_LIVE_STORE_DIGEST" != "$BRUNO_FOUNDER_EXPECTED_LIVE_PRODUCT_DIGEST"
          echo "BRUNO_FOUNDER_CONTRACT_RUNTIME_REVISION=$BRUNO_FOUNDER_PROTECTED_RUNTIME_REVISION" >> "$GITHUB_ENV"

      - name: Bind the deterministic CI runtime revision
        if: inputs.mode != 'release'
        run: echo "BRUNO_FOUNDER_CONTRACT_RUNTIME_REVISION=founder-contract-v1" >> "$GITHUB_ENV"

      - name: Reject previously failed exact candidate
        env:
          BRUNO_FOUNDER_CONTRACT_GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/check-founder-product-contract-candidate-history.ts

      - name: Create the durable protected release candidate control
        id: release_candidate_control
        if: inputs.mode == 'release'
        env:
          BRUNO_FOUNDER_CONTRACT_GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/founder-product-contract-candidate-control.ts create

      - name: Install exact browser engines
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run migrations
        run: bun run db:migrate

      - name: Bind the observation time
        run: echo "BRUNO_FOUNDER_CONTRACT_OBSERVED_AT=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" >> "$GITHUB_ENV"

      - name: Run all-or-nothing Founder Product Contract (release)
        if: inputs.mode == 'release'
        env:
          BRUNO_FOUNDER_CONTRACT_SCENARIO_SIGNING_SECRET: ${{ secrets.BRUNO_FOUNDER_CONTRACT_SCENARIO_SIGNING_SECRET }}
        run: bun run founder:contract

      - name: Run all-or-nothing Founder Product Contract (ci)
        if: inputs.mode != 'release'
        shell: bash
        run: |
          ci_signing_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$ci_signing_secret"
          BRUNO_FOUNDER_CONTRACT_SCENARIO_SIGNING_SECRET="$ci_signing_secret" bun run founder:contract

      - name: Attest the allowlisted exact-release summary
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            founder-contract-artifacts/founder-product-contract.json
            founder-contract-artifacts/founder-initial-general-release-decision.json

      - name: Retain the allowlisted summary
        uses: actions/upload-artifact@v4
        with:
          name: founder-product-contract-${{ github.sha }}
          path: |
            founder-contract-artifacts/founder-product-contract.json
            founder-contract-artifacts/founder-initial-general-release-decision.json
          if-no-files-found: error
          retention-days: 90

      - name: Finalize and enforce the durable release candidate control
        if: always() && inputs.mode == 'release'
        env:
          BRUNO_FOUNDER_CANDIDATE_CHECK_RUN_ID: ${{ steps.release_candidate_control.outputs.check_run_id }}
          BRUNO_FOUNDER_CONTRACT_GITHUB_TOKEN: ${{ github.token }}
          BRUNO_FOUNDER_PRIOR_JOB_STATUS: ${{ job.status }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          BRUNO_FOUNDER_RELEASE_RUNTIME_REVISION: ${{ env.BRUNO_FOUNDER_CONTRACT_RUNTIME_REVISION }}
        run: bun scripts/founder-product-contract-candidate-control.ts finalize
