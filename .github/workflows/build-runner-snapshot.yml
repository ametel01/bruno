name: Build runner snapshot

on:
  workflow_dispatch:
    inputs:
      cost_authorization:
        description: Exact billable-action sentinel required before any provider effect
        required: true
        type: string
      source_revision:
        description: Exact 40-character source commit to attest
        required: true
        type: string
      region:
        description: DigitalOcean target region
        required: true
        default: sfo3
        type: string
      size_slug:
        description: Builder size slug
        required: true
        type: string
      base_image_id:
        description: Authoritative Ubuntu base image ID
        required: true
        type: string
      base_image_slug:
        description: Ubuntu base image slug used for rollback comparison
        required: true
        default: ubuntu-24-04-x64
        type: string
      runner_image:
        description: Immutable runner image reference with sha256 digest
        required: true
        type: string
      default_agent_image:
        description: Immutable default agent image reference with sha256 digest
        required: true
        type: string
      hermes_image:
        description: Immutable Hermes image reference with sha256 digest
        required: true
        type: string

concurrency:
  group: runner-snapshot-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build protected runner snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: snapshot-build
    permissions:
      contents: read

    steps:
      - name: Validate authorization and static inputs before secrets
        env:
          BRUNO_SNAPSHOT_SIGNING_KEY_ID: ${{ vars.BRUNO_SNAPSHOT_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          test "${{ inputs.cost_authorization }}" = "I_UNDERSTAND_THIS_CREATES_A_BILLABLE_SNAPSHOT_BUILDER"
          [[ "${{ inputs.source_revision }}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${{ inputs.region }}" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,127}$ ]]
          [[ "${{ inputs.size_slug }}" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,127}$ ]]
          [[ "${{ inputs.runner_image }}" =~ @sha256:[a-f0-9]{64}$ ]]
          [[ "${{ inputs.default_agent_image }}" =~ @sha256:[a-f0-9]{64}$ ]]
          [[ "${{ inputs.hermes_image }}" =~ @sha256:[a-f0-9]{64}$ ]]
          [[ "$BRUNO_SNAPSHOT_SIGNING_KEY_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]

      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify Snapshot Attestation v2 contracts before provider effects
        run: >-
          bun --conditions react-server node_modules/.bin/vitest run --no-file-parallelism
          tests/unit/runner-snapshot-manifest.test.ts
          tests/unit/runner-snapshot-build.test.ts
          tests/unit/snapshot-builder-evidence-channel.test.ts
          tests/unit/runner-snapshot-registry.test.ts
          tests/unit/runner-snapshot-workflow.test.ts
          tests/unit/server-env.test.ts

      - name: Resolve controller SSH CIDR before provider effects
        run: |
          set -euo pipefail
          CONTROLLER_IP="$(curl -fsS --max-time 10 https://api64.ipify.org)"
          CONTROLLER_CIDR="$(
            CONTROLLER_IP="$CONTROLLER_IP" bun -e '
              import { isIP } from "node:net";
              const ip = process.env.CONTROLLER_IP?.trim() ?? "";
              if (ip === "0.0.0.0" || ip === "::" || ip === "") {
                throw new Error("controller egress identity was not explicit");
              }
              const family = isIP(ip);
              if (family === 4) {
                console.log(`${ip}/32`);
              } else if (family === 6) {
                console.log(`${ip}/128`);
              } else {
                throw new Error("controller egress identity was invalid");
              }
            '
          )"
          echo "BRUNO_SNAPSHOT_CONTROLLER_CIDR=$CONTROLLER_CIDR" >> "$GITHUB_ENV"

      - name: Prepare allowlisted artifact directory
        run: install -m 0750 -d snapshot-artifacts

      - name: Build signed snapshot bundle
        env:
          BRUNO_DIGITALOCEAN_TOKEN: ${{ secrets.BRUNO_DIGITALOCEAN_TOKEN }}
          BRUNO_SNAPSHOT_SIGNING_KEY_ID: ${{ vars.BRUNO_SNAPSHOT_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          install -m 0600 /dev/null snapshot-artifacts/signing-key.pem
          printf '%s' "${{ secrets.BRUNO_SNAPSHOT_SIGNING_KEY_PEM }}" > snapshot-artifacts/signing-key.pem
          bun run runner:snapshot:build -- \
            --cost-authorization "${{ inputs.cost_authorization }}" \
            --run-id "${{ github.run_id }}" \
            --source-revision "${{ inputs.source_revision }}" \
            --region "${{ inputs.region }}" \
            --size-slug "${{ inputs.size_slug }}" \
            --base-image-id "${{ inputs.base_image_id }}" \
            --base-image-slug "${{ inputs.base_image_slug }}" \
            --runner-image "${{ inputs.runner_image }}" \
            --default-agent-image "${{ inputs.default_agent_image }}" \
            --hermes-image "${{ inputs.hermes_image }}" \
            --controller-cidr "$BRUNO_SNAPSHOT_CONTROLLER_CIDR" \
            --boot-result-out snapshot-artifacts/boot-result.json \
            --sanitation-result-out snapshot-artifacts/sanitation-result.json \
            --failure-diagnostics-out snapshot-artifacts/failure-diagnostics.json \
            --cleanup-result-out snapshot-artifacts/cleanup-result.json \
            --signing-key snapshot-artifacts/signing-key.pem \
            --signing-key-id "$BRUNO_SNAPSHOT_SIGNING_KEY_ID" \
            --bundle-out snapshot-artifacts/runner-snapshot-bundle.json \
            --digest-out snapshot-artifacts/runner-snapshot-bundle.sha256

      - name: Validate retrieved builder evidence
        env:
          RUNNER_IMAGE: ${{ inputs.runner_image }}
          DEFAULT_AGENT_IMAGE: ${{ inputs.default_agent_image }}
          HERMES_IMAGE: ${{ inputs.hermes_image }}
        run: |
          set -euo pipefail
          test -s snapshot-artifacts/boot-result.json
          test -s snapshot-artifacts/sanitation-result.json
          test -s snapshot-artifacts/cleanup-result.json
          bun -e '
            const boot = await Bun.file("snapshot-artifacts/boot-result.json").json();
            const sanitation = await Bun.file("snapshot-artifacts/sanitation-result.json").json();
            const cleanup = await Bun.file("snapshot-artifacts/cleanup-result.json").json();
            const required = [process.env.RUNNER_IMAGE, process.env.DEFAULT_AGENT_IMAGE, process.env.HERMES_IMAGE].sort();
            if (
              boot?.ok !== true ||
              boot.runnerImage !== process.env.RUNNER_IMAGE ||
              boot.defaultAgentImage !== process.env.DEFAULT_AGENT_IMAGE ||
              boot.hermesImage !== process.env.HERMES_IMAGE ||
              boot.bootContractVersion !== "bruno.runner.boot.v1" ||
              !["docker", "hermesFixture", "detailedHealth", "modelCanary", "telegramConfig", "cleanup"].every((component) => boot.components?.[component] === "passed") ||
              JSON.stringify([...(boot.preloadedImages ?? [])].sort()) !== JSON.stringify(required)
            ) {
              throw new Error("builder boot evidence mismatch");
            }
            const removed = new Set(sanitation?.removedPaths ?? []);
            const scanned = new Set(sanitation?.scannedPaths ?? []);
            const markers = new Set(sanitation?.hostileMarkers ?? []);
            for (const value of ["/etc/bruno/runner.env", "/root/.docker/config.json", "/var/lib/cloud", "/root/.ssh/authorized_keys", "/root/.ssh/authorized_keys2", "/etc/ssh/ssh_host_ed25519_key", "/etc/machine-id", "/var/log/cloud-init-output.log", "/run/bruno-snapshot-builder/bootstrap-stage", "/usr/local/sbin/bruno-finalize-snapshot-sanitation"]) {
              if (!removed.has(value)) throw new Error("missing sanitation removal evidence");
            }
            for (const value of ["/etc", "/root", "/var/lib/bruno", "/var/log"]) {
              if (!scanned.has(value)) throw new Error("missing sanitation scan evidence");
            }
            for (const value of ["BRUNO_RUNNER_REGISTRATION_TOKEN", "BRUNO_RUNNER_BEARER_TOKEN", "dop_v1_", "BEGIN OPENSSH PRIVATE KEY"]) {
              if (!markers.has(value)) throw new Error("missing hostile marker evidence");
            }
            if (sanitation?.ok !== true || sanitation.forbiddenPathsAbsent !== true || sanitation.hostileMarkersAbsent !== true) {
              throw new Error("builder sanitation evidence mismatch");
            }
            if (
              cleanup?.absenceVerified !== true ||
              cleanup?.snapshotAbsenceVerified !== true ||
              cleanup?.sshKeyAbsenceVerified !== true ||
              cleanup?.ambiguousOwnership !== false ||
              cleanup?.sshKeyDeletionFailed !== false ||
              typeof cleanup?.deletedDropletId !== "string" ||
              typeof cleanup?.deletedFirewallId !== "string" ||
              typeof cleanup?.deletedSshKeyId !== "string"
            ) {
              throw new Error("builder cleanup evidence mismatch");
            }
          '

      - name: Cleanup temporary credentials and builder state
        if: always()
        run: |
          set -euo pipefail
          rm -f snapshot-artifacts/signing-key.pem
          echo "Cleanup step ran. Provider cleanup is also enforced by the snapshot build script."

      - name: Retain terminal cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-snapshot-cleanup-${{ github.run_id }}
          path: snapshot-artifacts/cleanup-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Retain sanitized builder diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-snapshot-builder-diagnostics-${{ github.run_id }}
          path: |
            snapshot-artifacts/boot-result.json
            snapshot-artifacts/sanitation-result.json
            snapshot-artifacts/failure-diagnostics.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload signed snapshot publication input
        uses: actions/upload-artifact@v4
        with:
          name: runner-snapshot-publication-input-${{ github.run_id }}
          path: |
            snapshot-artifacts/runner-snapshot-bundle.json
            snapshot-artifacts/runner-snapshot-bundle.sha256
            snapshot-artifacts/cleanup-result.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish protected snapshot bundle
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: snapshot-build
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check out trusted publication code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.3

      - name: Download signed snapshot publication input
        uses: actions/download-artifact@v4
        with:
          name: runner-snapshot-publication-input-${{ github.run_id }}
          path: snapshot-artifacts

      - name: Log in to GHCR for snapshot bundle publication
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish and re-verify digest-addressed snapshot bundle
        env:
          BRUNO_SNAPSHOT_TRUST_SET: ${{ vars.BRUNO_SNAPSHOT_TRUST_SET }}
          BRUNO_SNAPSHOT_PREVIOUS_OCI_REFERENCE: ${{ vars.BRUNO_SNAPSHOT_PREVIOUS_OCI_REFERENCE }}
          BRUNO_SNAPSHOT_PREVIOUS_BUNDLE_DIGEST: ${{ vars.BRUNO_SNAPSHOT_PREVIOUS_BUNDLE_DIGEST }}
        run: |
          set -euo pipefail
          bun run runner:snapshot:registry -- publish \
            --repository "ghcr.io/${{ github.repository_owner }}/bruno-runner-snapshot-bundles" \
            --bundle snapshot-artifacts/runner-snapshot-bundle.json \
            --digest snapshot-artifacts/runner-snapshot-bundle.sha256 \
            --public-key-out snapshot-artifacts/runner-snapshot-signing-key.pem \
            --publication-out snapshot-artifacts/runner-snapshot-oci-publication.json

      - name: Attest allowlisted bundle artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            snapshot-artifacts/runner-snapshot-bundle.json
            snapshot-artifacts/runner-snapshot-bundle.sha256
            snapshot-artifacts/runner-snapshot-signing-key.pem
            snapshot-artifacts/runner-snapshot-oci-publication.json
            snapshot-artifacts/cleanup-result.json

      - name: Upload allowlisted bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runner-snapshot-bundle-${{ github.run_id }}
          path: |
            snapshot-artifacts/runner-snapshot-bundle.json
            snapshot-artifacts/runner-snapshot-bundle.sha256
            snapshot-artifacts/runner-snapshot-signing-key.pem
            snapshot-artifacts/runner-snapshot-oci-publication.json
            snapshot-artifacts/cleanup-result.json
          if-no-files-found: error
          retention-days: 30
