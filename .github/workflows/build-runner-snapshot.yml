name: Build runner snapshot

on:
  workflow_dispatch:
    inputs:
      cost_authorization:
        description: Exact billable-action sentinel required before any provider effect
        required: true
        type: string
      source_revision:
        description: Exact 40-character source commit to attest
        required: true
        type: string
      region:
        description: DigitalOcean target region
        required: true
        default: sfo3
        type: string
      size_slug:
        description: Builder size slug
        required: true
        type: string
      base_image_id:
        description: Authoritative Ubuntu base image ID
        required: true
        type: string
      base_image_slug:
        description: Ubuntu base image slug used for rollback comparison
        required: true
        default: ubuntu-24-04-x64
        type: string
      runner_image:
        description: Immutable runner image reference with sha256 digest
        required: true
        type: string
      default_agent_image:
        description: Immutable default agent image reference with sha256 digest
        required: true
        type: string
      hermes_image:
        description: Immutable Hermes image reference with sha256 digest
        required: true
        type: string

concurrency:
  group: runner-snapshot-build
  cancel-in-progress: false

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  build:
    name: Build protected runner snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: snapshot-build

    steps:
      - name: Validate authorization and static inputs before secrets
        env:
          BRUNO_SNAPSHOT_SIGNING_KEY_ID: ${{ vars.BRUNO_SNAPSHOT_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          test "${{ inputs.cost_authorization }}" = "I_UNDERSTAND_THIS_CREATES_A_BILLABLE_SNAPSHOT_BUILDER"
          [[ "${{ inputs.source_revision }}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${{ inputs.region }}" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,127}$ ]]
          [[ "${{ inputs.size_slug }}" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,127}$ ]]
          [[ "${{ inputs.runner_image }}" =~ @sha256:[a-f0-9]{64}$ ]]
          [[ "${{ inputs.default_agent_image }}" =~ @sha256:[a-f0-9]{64}$ ]]
          [[ "${{ inputs.hermes_image }}" =~ @sha256:[a-f0-9]{64}$ ]]
          [[ "$BRUNO_SNAPSHOT_SIGNING_KEY_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]

      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Resolve controller SSH CIDR before provider effects
        run: |
          set -euo pipefail
          CONTROLLER_IP="$(curl -fsS --max-time 10 https://api64.ipify.org)"
          CONTROLLER_CIDR="$(
            CONTROLLER_IP="$CONTROLLER_IP" bun -e '
              import { isIP } from "node:net";
              const ip = process.env.CONTROLLER_IP?.trim() ?? "";
              if (ip === "0.0.0.0" || ip === "::" || ip === "") {
                throw new Error("controller egress identity was not explicit");
              }
              const family = isIP(ip);
              if (family === 4) {
                console.log(`${ip}/32`);
              } else if (family === 6) {
                console.log(`${ip}/128`);
              } else {
                throw new Error("controller egress identity was invalid");
              }
            '
          )"
          echo "BRUNO_SNAPSHOT_CONTROLLER_CIDR=$CONTROLLER_CIDR" >> "$GITHUB_ENV"

      - name: Prepare allowlisted artifact directory
        run: install -m 0750 -d snapshot-artifacts

      - name: Build signed snapshot bundle
        env:
          BRUNO_DIGITALOCEAN_TOKEN: ${{ secrets.BRUNO_DIGITALOCEAN_TOKEN }}
          BRUNO_SNAPSHOT_SIGNING_KEY_ID: ${{ vars.BRUNO_SNAPSHOT_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          install -m 0600 /dev/null snapshot-artifacts/signing-key.pem
          printf '%s' "${{ secrets.BRUNO_SNAPSHOT_SIGNING_KEY_PEM }}" > snapshot-artifacts/signing-key.pem
          bun run runner:snapshot:build -- \
            --cost-authorization "${{ inputs.cost_authorization }}" \
            --run-id "${{ github.run_id }}" \
            --source-revision "${{ inputs.source_revision }}" \
            --region "${{ inputs.region }}" \
            --size-slug "${{ inputs.size_slug }}" \
            --base-image-id "${{ inputs.base_image_id }}" \
            --base-image-slug "${{ inputs.base_image_slug }}" \
            --runner-image "${{ inputs.runner_image }}" \
            --default-agent-image "${{ inputs.default_agent_image }}" \
            --hermes-image "${{ inputs.hermes_image }}" \
            --controller-cidr "$BRUNO_SNAPSHOT_CONTROLLER_CIDR" \
            --boot-result-out snapshot-artifacts/boot-result.json \
            --sanitation-result-out snapshot-artifacts/sanitation-result.json \
            --signing-key snapshot-artifacts/signing-key.pem \
            --signing-key-id "$BRUNO_SNAPSHOT_SIGNING_KEY_ID" \
            --bundle-out snapshot-artifacts/runner-snapshot-bundle.json \
            --digest-out snapshot-artifacts/runner-snapshot-bundle.sha256

      - name: Validate retrieved builder evidence
        env:
          RUNNER_IMAGE: ${{ inputs.runner_image }}
          DEFAULT_AGENT_IMAGE: ${{ inputs.default_agent_image }}
          HERMES_IMAGE: ${{ inputs.hermes_image }}
        run: |
          set -euo pipefail
          test -s snapshot-artifacts/boot-result.json
          test -s snapshot-artifacts/sanitation-result.json
          bun -e '
            const boot = await Bun.file("snapshot-artifacts/boot-result.json").json();
            const sanitation = await Bun.file("snapshot-artifacts/sanitation-result.json").json();
            const required = [process.env.RUNNER_IMAGE, process.env.DEFAULT_AGENT_IMAGE, process.env.HERMES_IMAGE].sort();
            if (
              boot?.ok !== true ||
              boot.runnerImage !== process.env.RUNNER_IMAGE ||
              boot.defaultAgentImage !== process.env.DEFAULT_AGENT_IMAGE ||
              boot.hermesImage !== process.env.HERMES_IMAGE ||
              boot.bootContractVersion !== "bruno.runner.boot.v1" ||
              JSON.stringify([...(boot.preloadedImages ?? [])].sort()) !== JSON.stringify(required)
            ) {
              throw new Error("builder boot evidence mismatch");
            }
            const removed = new Set(sanitation?.removedPaths ?? []);
            const scanned = new Set(sanitation?.scannedPaths ?? []);
            const markers = new Set(sanitation?.hostileMarkers ?? []);
            for (const value of ["/etc/bruno/runner.env", "/root/.docker/config.json", "/var/lib/cloud/instances", "/etc/ssh/ssh_host_ed25519_key", "/etc/machine-id", "/var/log/cloud-init-output.log"]) {
              if (!removed.has(value)) throw new Error("missing sanitation removal evidence");
            }
            for (const value of ["/etc", "/root", "/var/lib/bruno", "/var/log"]) {
              if (!scanned.has(value)) throw new Error("missing sanitation scan evidence");
            }
            for (const value of ["BRUNO_RUNNER_REGISTRATION_TOKEN", "BRUNO_RUNNER_BEARER_TOKEN", "dop_v1_", "BEGIN OPENSSH PRIVATE KEY"]) {
              if (!markers.has(value)) throw new Error("missing hostile marker evidence");
            }
            if (sanitation?.ok !== true || sanitation.forbiddenPathsAbsent !== true || sanitation.hostileMarkersAbsent !== true) {
              throw new Error("builder sanitation evidence mismatch");
            }
          '

      - name: Cleanup temporary credentials and builder state
        if: always()
        run: |
          set -euo pipefail
          rm -f snapshot-artifacts/signing-key.pem
          echo "Cleanup step ran. Provider cleanup is also enforced by the snapshot build script."

      - name: Attest allowlisted bundle artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            snapshot-artifacts/runner-snapshot-bundle.json
            snapshot-artifacts/runner-snapshot-bundle.sha256

      - name: Upload allowlisted bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runner-snapshot-bundle-${{ github.run_id }}
          path: |
            snapshot-artifacts/runner-snapshot-bundle.json
            snapshot-artifacts/runner-snapshot-bundle.sha256
          if-no-files-found: error
          retention-days: 30
