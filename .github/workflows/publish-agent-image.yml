name: Publish Hermes workload image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.agent
      - .github/workflows/publish-agent-image.yml

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ametel01/bruno-hermes
  LOCAL_IMAGE: bruno-hermes:ci
  UPSTREAM_IMAGE: nousresearch/hermes-agent:v2026.7.7.2
  UPSTREAM_INDEX_DIGEST: sha256:9c841866021c54c4596849f6135717e8a4d52ba510b7f52c50aef1de1a283973

jobs:
  publish:
    name: Build, scan, and publish Hermes workload image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify upstream Hermes digest
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "${UPSTREAM_IMAGE}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "${DIGEST}" = "${UPSTREAM_INDEX_DIGEST}"

      - name: Build local workload image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64
          load: true
          tags: ${{ env.LOCAL_IMAGE }}

      - name: Smoke local workload image
        env:
          BRUNO_HERMES_IMAGE: ${{ env.LOCAL_IMAGE }}
        run: bun scripts/smoke-hermes-agent-image.ts

      - name: Scan critical fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln
          format: sarif
          output: trivy-agent-image.sarif
          severity: CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-agent-image-${{ github.sha }}
          path: trivy-agent-image.sarif
          if-no-files-found: error
          retention-days: 90

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push workload image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:hermes-v2026.7.7.2
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Digest verification
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}"
          docker buildx imagetools inspect "${IMAGE}"
          echo "published_digest=${{ steps.push.outputs.digest }}" >> "${GITHUB_STEP_SUMMARY}"
