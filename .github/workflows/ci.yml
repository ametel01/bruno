name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DATABASE_URL: postgres://agentbay:agentbay@127.0.0.1:54329/agentbay
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  verify:
    name: Verification gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agentbay
          POSTGRES_USER: agentbay
          POSTGRES_PASSWORD: agentbay
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U agentbay -d agentbay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run migrations
        run: bun run db:migrate

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Build local runner image
        run: docker build --file Dockerfile.runner --tag agentbay-runner:local .

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          AGENTBAY_DIGITALOCEAN_PROVIDER_MODE: local_docker
          AGENTBAY_DIGITALOCEAN_TOKEN: local-docker
          AGENTBAY_DIGITALOCEAN_SSH_KEY_IDS: none
          AGENTBAY_LOCAL_CLOUD_RUNNER_ENDPOINT_URL: http://127.0.0.1:3045
          AGENTBAY_RUNNER_BEARER_TOKEN: local-runner-command-token
          AGENTBAY_RUNNER_IMAGE: agentbay-runner:local
          NEXT_PUBLIC_APP_URL: http://host.docker.internal:3100
